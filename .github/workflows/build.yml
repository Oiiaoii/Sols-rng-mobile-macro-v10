name: Build APK
on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - name: Locate Gradle project
    shell: bash
    run: find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
