name: Build APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Inspect project structure
    run: |
      echo "Repository root:"
      pwd
      echo "Files and folders:"
      find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: 8.9

  - name: Build debug APK
    run: gradle assembleDebug --stacktrace --no-daemon
